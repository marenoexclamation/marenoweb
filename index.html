:root { color-scheme: light; font-family: "Latin Modern Roman", "Computer Modern", "CMU Serif", "Times New Roman", serif; font-size: 100%; color: #555; background: #fff; }

body { margin: 0; line-height: 1.65; }

.site { max-width: 960px; padding: 56px 36px 96px; margin: 0 auto; }

  info: ['As a guitarist and composer, I create tracks and structure live sets using rap, blues, jazz improvisation, beatmaking, voice, sampling, instruments, electronic sounds, field recordings, and custom software. Composition, DJing, and improvisation change through their interaction with one another.', 'My work stems from repetitive, intrusive memories; obsessions with and lingering attachments to people and places—along with the longing and affection directed toward them—and the stress and difficulty inherent in building and maintaining those relationships. (Recently, I have been trying to express these through instruments involving exhalation and instruments linked to bodily movement.)', 'Repeating a sound is very similar to the way memories shift: just as the content of a stored memory changes slightly with each repetition, or the boundary blurs between time actually spent with a person and time spent thinking about them in their absence—or how one might spend more time thinking about a place than actually inhabiting it—loops repeat the same sound, yet the listener\'s position shifts slightly each time. For me, the state of recalling the distant past serves as an imperfect record of what once existed; it becomes something distinct from the events that actually occurred. Ultimately, I am interested in a state where the distinctions between actual experience, memory, what is reconstructed during creation, and what is added later for the sake of explanation begin to dissolve.'],

            <div class="ruleRow"><span class="ruleKey">drag object</span><span>move object</span></div>
            <div class="ruleRow"><span class="ruleKey">pinch empty space</span><span>resize balls</span></div>
            <div class="ruleRow"><span class="ruleKey">＋</span><span>add object</span></div>
            <div class="ruleRow"><span class="ruleKey">−</span><span>delete object</span></div>
            <div class="ruleRow"><span class="ruleForceIcon" data-rule-force="attract"></span><span>attract balls</span></div>
            <div class="ruleRow"><span class="ruleForceIcon" data-rule-force="repel"></span><span>repel balls</span></div>
            <div class="ruleRow"><span class="ruleForceIcon" data-rule-force="gravity"></span><span>apply gravity</span></div>
            <div class="ruleRow"><span class="ruleForceIcon" data-rule-force="freeze"></span><span>freeze balls</span></div>
            <div class="ruleRow"><span class="ruleKey">double-tap chord</span><span>edit chord text</span></div>
            <div class="ruleRow"><span class="ruleKey">pinch chord</span><span>resize chord</span></div>
          `;
          const ruleForceSources = {
            attract: doc.getElementById('grabTool'),
            repel: doc.getElementById('repelButton'),
            gravity: doc.getElementById('gravityButton'),
            freeze: doc.getElementById('freezeTool')
          };
          for (const [name, source] of Object.entries(ruleForceSources)) {
            const cell = ruleGrid.querySelector(`[data-rule-force="${name}"]`);
            const icon = source?.querySelector('svg')?.cloneNode(true);
            if (cell && icon) cell.appendChild(icon);
          }
        }
      }
      if (isIPhoneHost) {
      }
      const preserveSkinPosition = () => {
        const header = ballWindow.querySelector(':scope > .liveWindowHeader');
        const tools = header.querySelector('.headerObjectTools');
        const skin = header.querySelector('.ballSkinControl');
        const audio = header.querySelector('.sectionAudioTools');
        const rail = parseFloat(frame.contentWindow.getComputedStyle(ballWindow).getPropertyValue('--ball-header-gauge-length')) || 61;
        const oldGroupWidth = 138 + 3 * (80 + rail) + 32 + skin.offsetWidth;
        const audioLeft = header.clientWidth - 6 - audio.offsetWidth;
        const gap = (audioLeft - (tools.offsetLeft + tools.offsetWidth) - oldGroupWidth) / 2;
        ballWindow.style.setProperty('--skin-right-space', Math.max(0, gap - 8) + 'px');
      };
      const skinLayoutObserver = new frame.contentWindow.ResizeObserver(preserveSkinPosition);
      skinLayoutObserver.observe(ballHeader);
      skinLayoutObserver.observe(ballHeader.querySelector('#zoomRange'));
      requestAnimationFrame(preserveSkinPosition);
      const setSectionTitle = (id, text) => {
        const title = doc.querySelector('#' + id + ' > .liveWindowHeader > span:first-child');
        if (title) title.textContent = text;
      };
      setSectionTitle('ballSoundWindow', 'BALL');
      setSectionTitle('surfaceWindow', 'SURFACE');
      setSectionTitle('lineWindow', 'LINE');
      setSectionTitle('chordWindow', 'CHORD');

      const syncMetricLabelTypography = () => {
        const scaleLabel = doc.getElementById('zoomLabel');
        const frictionLabel = doc.querySelector('#frictionControl > span:first-child');
        const hoppingLabel = doc.querySelector('#movementControl > span:first-child');
        if (!scaleLabel) return;
        const st = frame.contentWindow.getComputedStyle(scaleLabel);
        for (const label of [frictionLabel, hoppingLabel].filter(Boolean)) {
          label.style.setProperty('font-size', st.fontSize, 'important');
          label.style.setProperty('font-family', st.fontFamily, 'important');
          label.style.setProperty('font-weight', st.fontWeight, 'important');
          label.style.setProperty('letter-spacing', st.letterSpacing, 'important');
        }
      };
      syncMetricLabelTypography();
      frame.contentWindow.addEventListener('livewindowlayoutchange', syncMetricLabelTypography);
    })();
    const normalizeObjectToolOrder = () => {
      const ballTools = doc.querySelector('#ballSoundWindow .headerObjectTools');
      const lineTools = doc.querySelector('#lineWindow .headerObjectTools');
      const chordTools = doc.querySelector('#chordWindow .headerObjectTools');

      const addBall = doc.getElementById('addBallTool');
      const removeBall = doc.getElementById('removeBallTool');
      const clearBalls = doc.getElementById('clearBallsTool');
      if (ballTools && addBall && removeBall && clearBalls) {
        ballTools.prepend(addBall);
        addBall.after(removeBall);
        removeBall.after(clearBalls);
      }

      const penTool = doc.getElementById('penTool');
      const eraserTool = doc.getElementById('eraserTool');
      const clearTool = doc.getElementById('clearTool');
      if (lineTools && penTool && eraserTool && clearTool) {
        lineTools.prepend(penTool);
        penTool.after(eraserTool);
        eraserTool.after(clearTool);
      }

      const addChord = doc.getElementById('addChordButton');
      const removeChord = doc.getElementById('removeChordButton');
      const clearChords = doc.getElementById('clearChordsButton');
      if (chordTools && addChord && removeChord && clearChords) {
        chordTools.prepend(addChord);
        addChord.after(removeChord);
        removeChord.after(clearChords);
      }
    };
    normalizeObjectToolOrder();
    frame.contentWindow.addEventListener('livewindowlayoutchange', normalizeObjectToolOrder);
    const menuRuleLabel = doc.querySelector('#utilityWindow .performanceRule > summary');
    if (menuRuleLabel) menuRuleLabel.textContent = 'RULE';
    if (isIPhoneHost && menuRuleLabel) {
      const menuRule = menuRuleLabel.closest('.performanceRule');
      const mobileRuleGrid = menuRule?.querySelector('.performanceRuleGrid');
      if (mobileRuleGrid) {
        mobileRuleGrid.classList.add('iphoneRuleOverlay');
        mobileRuleGrid.hidden = true;
        doc.body.appendChild(mobileRuleGrid);
      }
      menuRuleLabel.style.setProperty('pointer-events', 'auto', 'important');
      menuRuleLabel.style.setProperty('position', 'relative', 'important');
      menuRuleLabel.style.setProperty('z-index', '10051', 'important');
      menuRuleLabel.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        if (!mobileRuleGrid) return;
        mobileRuleGrid.hidden = !mobileRuleGrid.hidden;
        if (menuRule) menuRule.open = !mobileRuleGrid.hidden;
      });
      const closeMobileRuleOverlay = () => {
        if (!mobileRuleGrid) return;
        mobileRuleGrid.hidden = true;
        if (menuRule) menuRule.open = false;
      };
      doc.addEventListener('pointerdown', event => {
        if (!mobileRuleGrid || mobileRuleGrid.hidden) return;
        if (mobileRuleGrid.contains(event.target) || menuRuleLabel.contains(event.target)) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        closeMobileRuleOverlay();
      }, true);
      frame.contentWindow.addEventListener('livewindowlayoutchange', () => {
        if (doc.body.classList.contains('liveWindowsHidden')) closeMobileRuleOverlay();
      });
    }

    const transientPanelGuard = event => {
      const notation = doc.getElementById('chordNotation');
      if (notation?.open && !notation.contains(event.target)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        notation.open = false;
        return;
      }
      if (!isIPhoneHost && menuRule?.open) {
        const ruleGrid = menuRule.querySelector('.performanceRuleGrid');
        if (!menuRuleLabel.contains(event.target) && !ruleGrid?.contains(event.target)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          menuRule.open = false;
        }
      }
    };
    doc.addEventListener('pointerdown', transientPanelGuard, true);

    const mobileChordFocusFix = doc.createElement('script');
    mobileChordFocusFix.textContent = `(() => {
      if (!document.body.classList.contains('iphoneHost')) return;
      document.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        const target = event.target;
        if (!target?.matches?.('#chordText, .chordInlineEditor, .chordListItem input[type="text"]')) return;
        setTimeout(() => target.blur?.(), 0);
      }, true);
    })();`;
    doc.body.appendChild(mobileChordFocusFix);

    const chordResizeClamp = doc.createElement('script');
    chordResizeClamp.textContent = `(() => {
      let chordClampFrame = 0;

      function clampChordObjectsToViewport() {
        chordClampFrame = 0;
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        for (const chord of chordObjects) {
          if (!chord?.element) continue;

          const rect = chord.element.getBoundingClientRect();
          const maxX = Math.max(0, viewportWidth - rect.width);
          const maxY = Math.max(0, viewportHeight - rect.height);
          const nextX = Math.max(0, Math.min(maxX, chord.x));
          const nextY = Math.max(0, Math.min(maxY, chord.y));

          if (nextX !== chord.x || nextY !== chord.y) {
            chord.x = nextX;
            chord.y = nextY;
            updateChordElement(chord);
          }
        }

        if (selectedChord) positionChordResizeHandle(selectedChord);
      }

      function scheduleChordClamp() {
        cancelAnimationFrame(chordClampFrame);
        chordClampFrame = requestAnimationFrame(() =>
          requestAnimationFrame(clampChordObjectsToViewport)
        );
      }

      window.addEventListener('resize', scheduleChordClamp);
      document.fonts?.ready.then(scheduleChordClamp);
      scheduleChordClamp();
    })();`;
    doc.body.appendChild(chordResizeClamp);

    const unlockAudio = () => frame.contentWindow.initAudio?.();
    document.addEventListener('pointerdown', unlockAudio, { once: true, capture: true });
    document.addEventListener('keydown', unlockAudio, { once: true, capture: true });

    const syncMenu = () => root.classList.toggle('menu-open',
      !doc.body.classList.contains('liveWindowsHidden'));
    menuObserver = new MutationObserver(syncMenu);
    menuObserver.observe(doc.body, { attributes: true, attributeFilter: ['class'] });
    syncMenu();
    root.dataset.loaded = 'true';
  }, { once: true });
  root.append(frame);
  return {
    root, state, events,
    routeChanged(route) {
      state.set('route', route);
      events.dispatchEvent(new CustomEvent('routechange', { detail: { route } }));
    },
    destroy() {
      menuObserver?.disconnect();
      frame.remove();
      state.clear();
    },
  };
}

const main = document.querySelector('main');
const runtime = createInteractiveRuntime(document.querySelector('#interactive-layer'));
const fitReadingArea = () => {
  const top = main.getBoundingClientRect().top;
  main.style.setProperty('--reading-height', Math.max(100, innerHeight - top - 20) + 'px');
};
window.addEventListener('resize', fitReadingArea);
const routes = ['home', 'info', 'releases', 'live', 'photos', 'video', 'links', 'contact'];

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function safeURL(value) {
  if (!value) return null;
  if (/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(value)) return value;
  try {
    const url = new URL(value, location.href);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
  } catch { return null; }
}
function links(items) {
  const list = element('ul', undefined, 'links');
  for (const item of items ?? []) {
    const url = safeURL(item.url);
    if (!url) continue;
    const link = element('a', item.label);
    link.href = url;
    if (/[^\x00-\x7F]/.test(item.label)) link.lang = 'ja';
    const li = element('li');
    li.append(link);
    list.append(li);
  }
  return list;
}
function image(src, alt, className) {
  const img = element('img', undefined, className);
  img.src = safeURL(src) ?? '';
  img.alt = alt;
  img.loading = 'lazy';
  img.decoding = 'async';
  return img;
}
function dateLabel(date) { return String(date || '').replace(/-/g, '.'); }
function entryHeading(title, date, tag) {
  const heading = element('div', undefined, 'entry-heading');
  heading.append(element(tag, title));
  if (date) {
    const time = element('time', dateLabel(date));
    if (/^\d{4}(-\d{2}){0,2}$/.test(date)) time.dateTime = date;
    heading.append(time);
  }
  return heading;
}
function compactEntry(parts, date, className) {
  const article = element('article', undefined, className);
  const line = element('div', undefined, 'entry-heading');
  const text = parts.filter(Boolean).join('　');
  line.append(element(className === 'release' ? 'h2' : 'h3', text));
  if (date) {
    const time = element('time', dateLabel(date));
    if (/^\d{4}(-\d{2}){0,2}$/.test(date)) time.dateTime = date;
    line.append(time);
  }
  article.append(line);
  main.append(article);
}
function renderReleases() {
  for (const release of [...content.releases].sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')))) {
    const article = element('article', undefined, 'release');
    const line = element('div', undefined, 'entry-heading');
    const heading = element('h2');
    const targetUrl = release.bandcampUrl || release.streamingUrls?.[0]?.url || '';
    if (targetUrl) {
      const link = element('a', release.title);
      link.href = targetUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
      heading.append(link);
    } else heading.textContent = release.title;
    line.append(heading);
    const date = release.date || release.year;
    if (date) {
      const time = element('time', dateLabel(date));
      if (/^\d{4}(-\d{2}){0,2}$/.test(date)) time.dateTime = date;
      line.append(time);
    }
    article.append(line); main.append(article);
  }
}
function renderLive() {
  for (const event of content.live) {
    const article = element('article', undefined, 'event');
    const line = element('div', undefined, 'entry-heading live-entry-line');
    const time = element('time', event.date);
    const title = element('h3', event.title || '');
    const place = element('span', [event.venue, event.location].filter(Boolean).join(' '), 'live-place');
    line.append(time, title, place);
    article.append(line);
    main.append(article);
  }
}
function renderPhotos() {
  for (const photo of content.photos) {
    const figure = element('figure');
    const link = element('a', undefined, 'photo-link');
    link.href = safeURL(photo.src);
    const img = image(photo.src, photo.alt, 'photo');
    if (photo.width && photo.height) {
      img.width = photo.width;
      img.height = photo.height;
    }
    img.addEventListener('error', () => { figure.hidden = true; }, { once: true });
    link.append(img);
    figure.append(link);
    if (photo.caption) figure.append(element('figcaption', photo.caption));
    main.append(figure);
  }
}
function renderVideo() {
  const wrap = element('div', undefined, 'video-embed-wrap');

  const frame = element('iframe', undefined, 'video-embed');
  frame.src = 'https://www.youtube.com/embed/oVeruIWXl-k?playsinline=1';
  frame.title = 'mareno! - Sakuramiya';
  frame.loading = 'lazy';
  frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  frame.referrerPolicy = 'origin-when-cross-origin';
  frame.allowFullscreen = true;

  const fallback = element('a', 'Watch on YouTube', 'video-fallback');
  fallback.href = 'https://www.youtube.com/watch?v=oVeruIWXl-k';
  fallback.target = '_blank';
  fallback.rel = 'noopener noreferrer';

  wrap.append(frame, fallback);
  main.append(wrap);
}
function render(focus = false) {
  const requested = location.hash.slice(1).toLowerCase() || 'home';
  if (requested === 'content') {
    runtime.routeChanged(runtime.state.get('route') || 'home');
    main.focus();
    return;
  }
  const route = routes.includes(requested) ? requested : 'home';
  main.replaceChildren();
  document.title = route === 'home' ? content.name : `${route.toUpperCase()} — ${content.name}`;
  for (const link of document.querySelectorAll('nav a')) {
    if (link.hash === `#${route}`) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  }
  if (route === 'home') {  }
  if (route === 'info') main.append(...content.info.map(paragraph => element('p', paragraph)));
  if (route === 'releases') renderReleases();
  if (route === 'live') renderLive();
  if (route === 'photos') renderPhotos();
  if (route === 'video') renderVideo();
  if (route === 'links') main.append(links(content.links));
  if (route === 'contact') {
    if (content.contact.text) main.append(element('p', content.contact.text));
    if (content.contact.email) {
      const address = element('a', content.contact.email);
      address.href = `mailto:${content.contact.email}`;
      const paragraph = element('p');
      paragraph.append(address);
      main.append(paragraph);
    }
    main.append(links(content.contact.links));
  }
  main.scrollTop = 0;
  fitReadingArea();
  runtime.routeChanged(route);
  if (focus) { main.focus({ preventScroll: true }); window.scrollTo(0, 0); }
}

if (IS_IPHONE_HOST) {
  const siteNav = document.querySelector('nav');
  if (siteNav) {
    siteNav.style.touchAction = 'none';
    siteNav.style.overscrollBehavior = 'none';
    siteNav.addEventListener('touchmove', event => {
      event.preventDefault();
    }, { passive: false });
  }
  document.documentElement.style.overscrollBehaviorY = 'none';
  document.body.style.overscrollBehaviorY = 'none';
}

window.addEventListener('hashchange', () => render(true));
render();

</script>

body.menuLayoutA #utilityTransportControl,

body.menuLayoutA #utilityTransportControl::before,
body.menuLayoutA #utilityTransportControl::after,
body.menuLayoutA #utilityTransportControl .transportSegmentedButtonGroup::before,
body.menuLayoutA #utilityTransportControl .transportSegmentedButtonGroup::after,
body.menuLayoutA #utilityTransportControl .transportSegmentedButton::before,
body.menuLayoutA #utilityTransportControl .transportSegmentedButton::after {
  border-bottom: 0 !important;
  box-shadow: none !important;
}

body.menuLayoutA #utilityTransportControl,
body.menuLayoutA #utilityTransportControl > .transportSegmentedButtonGroup {
  position: relative !important;
}
body.menuLayoutA #utilityTransportControl > .transportSegmentedButtonGroup::after {
  content: "" !important;
  position: absolute !important;
  left: 0 !important;
  right: 0 !important;
  bottom: -1px !important;
  height: 2px !important;
  background: #fff !important;
  pointer-events: none !important;
}
</style>
